version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: BETA/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_PORT=8000
    restart: always

  # Future-proofing: We can add a Redis cache or Postgres DB here later
